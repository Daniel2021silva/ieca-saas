<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro - IECA</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CSS -->
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
</head>

<body class="center">

<div class="login-box">

    <h2>Criar Conta</h2>

    <input type="text" id="nome" placeholder="Nome">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha">

    <!-- TIPO -->
    <select id="tipo">
        <option value="lider">Líder</option>
        <option value="admin">Admin</option>
    </select>

    <!-- CONGREGAÇÃO -->
    <input type="text" id="congregacao" placeholder="Nome da Congregação">

    <!-- DEPARTAMENTO -->
    <select id="departamento">
        <option value="jovens">Ministério Jovem</option>
        <option value="diaconato">Diaconato</option>
        <option value="coral">Coral</option>
        <option value="infantil">Ministério Infantil</option>
        <option value="homens">Grupo de Homens</option>
        <option value="mulheres">Grupo de Mulheres</option>
        <option value="financeiro">Financeiro</option>
        <option value="secretaria">Secretaria</option>
        <option value="missoes">Missões</option>
        <option value="intercessao">Intercessão</option>
    </select>

    <button onclick="registrar()">Cadastrar</button>

    <p class="publico" onclick="window.location.href='index.html'">
        Já tenho conta
    </p>

    <div class="lang">
        <button onclick="setLang('pt')">🇧🇷</button>
        <button onclick="setLang('en')">🇺🇸</button>
    </div>

</div>

<!-- SCRIPTS -->
<script src="js/services/storage.js"></script>
<script src="js/utils/constants.js"></script>
<script src="js/utils/i18n.js"></script>
<script src="js/modules/auth.js"></script>

<!-- SCRIPT DO CADASTRO -->
<script>
function registrar(){

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const tipo = document.getElementById("tipo").value;
    const congregacao = document.getElementById("congregacao").value.trim();
    const departamento = document.getElementById("departamento").value;

    if(!nome || !email || !senha){
        alert("Preencha todos os campos");
        return;
    }

    let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    // evitar email duplicado
    const existe = usuarios.find(u => u.email === email);

    if(existe){
        alert("Email já cadastrado");
        return;
    }

    const novoUsuario = {
        nome,
        email,
        senha,
        tipo,
        congregacao,
        departamento
    };

    usuarios.push(novoUsuario);

    localStorage.setItem("usuarios", JSON.stringify(usuarios));

    alert("Conta criada com sucesso!");

    window.location.href = "index.html";
}
</script>

</body>
</html>
