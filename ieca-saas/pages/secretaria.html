<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Secretaria - IECA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef2f7;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color:#1f2937;
}

.page{
    max-width:1200px;
    margin:0 auto;
    padding:20px;
}

.topo-flex{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.topo-titulo h1{
    margin:0;
    font-size:28px;
    color:#0f172a;
}

.topo-titulo p{
    margin:6px 0 0;
    color:#64748b;
    font-size:14px;
}

.btn-voltar{
    background:#1e293b;
    color:white;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    display:none;
    font-weight:600;
}

.btn-voltar:hover{
    opacity:.92;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:12px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:18px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
}

.card h2{
    margin:0 0 6px;
    color:#007bff;
    font-size:30px;
}

.card p{
    margin:0;
    color:#64748b;
    font-weight:600;
}

.form-box,
.table-box,
.ocorrencias-box,
.patrimonio-box{
    background:#fff;
    padding:18px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
}

.form-box h3,
.ocorrencias-box h3,
.patrimonio-box h3{
    margin-top:0;
    color:#0f172a;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:12px;
}

.form-actions{
    display:flex;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
}

input, select, textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #d1d5db;
    outline:none;
    font-size:14px;
    background:#fff;
}

input:focus, select:focus, textarea:focus{
    border-color:#007bff;
    box-shadow:0 0 0 3px rgba(0,123,255,0.12);
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    padding:11px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.2s ease;
}

button:hover{
    transform:translateY(-1px);
}

.primary{
    background:#007bff;
    color:white;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

.danger{
    background:#dc2626;
    color:white;
}

.action-btn{
    padding:8px 10px;
    border-radius:8px;
    font-size:13px;
    margin:2px;
}

.search-box{
    margin-bottom:16px;
}

.search-box input{
    background:#fff;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
}

th{
    background:#007bff;
    color:white;
    padding:12px;
    text-align:left;
    font-size:14px;
}

td{
    padding:12px 10px;
    border-bottom:1px solid #e5e7eb;
    vertical-align:middle;
    font-size:14px;
}

.ativo{
    color:green;
    font-weight:bold;
}

.inativo{
    color:red;
    font-weight:bold;
}

.badge-matriz{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.ocorrencia{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    padding:14px;
    border-radius:12px;
    margin-bottom:12px;
}

.ocorrencia h4{
    margin:0 0 6px;
    color:#0f172a;
}

.ocorrencia p{
    margin:4px 0;
}

.status-ok{
    color:green;
    font-weight:bold;
}

.status-pendente{
    color:#d97706;
    font-weight:bold;
}

.empty{
    text-align:center;
    color:#64748b;
    padding:20px 10px;
}

.info-top{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
}

.estado-bom{
    color:green;
    font-weight:bold;
}

.estado-regular{
    color:#d97706;
    font-weight:bold;
}

.estado-ruim{
    color:red;
    font-weight:bold;
}

@media(max-width:768px){
    .topo-titulo h1{
        font-size:22px;
    }

    .page{
        padding:14px;
    }

    th, td{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="topo-flex">
        <div class="topo-titulo">
            <h1 id="titulo">📋 Secretaria</h1>
            <div class="info-top">
                <p id="subtitulo">Gestão de membros e ocorrências.</p>
                <span id="modoSistema" class="badge-matriz" style="display:none;">VISÃO MATRIZ</span>
            </div>
        </div>

        <button id="btnVoltar" class="btn-voltar" onclick="voltarMatriz()">⬅ Voltar para Matriz</button>
    </div>

    <div class="dashboard">
        <div class="card">
            <h2 id="total">0</h2>
            <p>Total</p>
        </div>
        <div class="card">
            <h2 id="ativos">0</h2>
            <p>Ativos</p>
        </div>
        <div class="card">
            <h2 id="inativos">0</h2>
            <p>Inativos</p>
        </div>
    </div>

    <div class="form-box">
        <h3>👥 Cadastro de Membros</h3>

        <div class="form-grid">
            <input type="text" id="nome" placeholder="Nome completo">
            <input type="text" id="telefone" placeholder="Telefone com DDD">
            <input type="text" id="endereco" placeholder="Endereço">
            <select id="cargo">
                <option value="Membro">Membro</option>
                <option value="Obreiro">Obreiro</option>
                <option value="Diácono">Diácono</option>
                <option value="Presbítero">Presbítero</option>
                <option value="Missionário">Missionário</option>
                <option value="Evangelista">Evangelista</option>
                <option value="Pastor">Pastor</option>
            </select>
            <input type="date" id="batismo" title="Data de batismo">
            <input type="date" id="entrada" title="Data de entrada">
            <input type="date" id="desligamento" title="Data de desligamento">
        </div>

        <div class="form-actions">
            <button class="primary" onclick="salvarMembro()">Salvar membro</button>
            <button class="secondary" onclick="cancelarEdicao()">Cancelar edição</button>
        </div>
    </div>

    <div class="table-box">
        <div class="search-box">
            <input type="text" id="busca" placeholder="🔍 Buscar por nome, telefone, cargo ou congregação..." onkeyup="renderTabela()">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cargo</th>
                        <th>Contato</th>
                        <th>Status</th>
                        <th id="thCongregacao" style="display:none;">Congregação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaMembros"></tbody>
            </table>
        </div>
    </div>

    <div class="ocorrencias-box">
        <h3>⚠️ Ocorrências</h3>

        <div class="form-grid">
            <input type="text" id="nomeOcorrencia" placeholder="Nome do membro">
            <input type="date" id="dataOcorrencia">
            <select id="statusOcorrencia">
                <option value="nao">Não disciplinado</option>
                <option value="sim">Disciplinado</option>
            </select>
            <textarea id="descricaoOcorrencia" placeholder="Descreva a ocorrência"></textarea>
        </div>

        <div class="form-actions">
            <button class="primary" onclick="salvarOcorrencia()">Registrar ocorrência</button>
        </div>
    </div>

    <div id="listaOcorrencias"></div>

    <div class="patrimonio-box">
        <h3>🏛️ Patrimônio da Igreja</h3>

        <div class="form-grid">
            <input type="text" id="patrimonioNome" placeholder="Nome do item (ex: Cadeiras)">
            <select id="patrimonioCategoria">
                <option value="Móveis">Móveis</option>
                <option value="Som">Som</option>
                <option value="Decoração">Decoração</option>
                <option value="Utensílios">Utensílios</option>
                <option value="Ventilação">Ventilação</option>
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Instrumentos">Instrumentos</option>
                <option value="Outro">Outro</option>
            </select>
            <input type="number" id="patrimonioQuantidade" placeholder="Quantidade" min="1">
            <select id="patrimonioEstado">
                <option value="Bom">Bom</option>
                <option value="Regular">Regular</option>
                <option value="Ruim">Ruim</option>
            </select>
            <input type="date" id="patrimonioData">
            <input type="text" id="patrimonioLocal" placeholder="Local/Setor (ex: Templo, Cozinha, Sala Jovens)">
            <textarea id="patrimonioObservacao" placeholder="Observações sobre o item"></textarea>
        </div>

        <div class="form-actions">
            <button class="primary" onclick="salvarPatrimonio()">Salvar patrimônio</button>
            <button class="secondary" onclick="cancelarEdicaoPatrimonio()">Cancelar edição</button>
        </div>
    </div>

    <div class="table-box">
        <div class="search-box">
            <input type="text" id="buscaPatrimonio" placeholder="🔍 Buscar patrimônio por nome, categoria, estado, local ou congregação..." onkeyup="renderPatrimonio()">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Categoria</th>
                        <th>Qtd</th>
                        <th>Estado</th>
                        <th>Local</th>
                        <th>Data</th>
                        <th id="thCongregacaoPatrimonio" style="display:none;">Congregação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaPatrimonio"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="../js/services/storage.js"></script>

<script>
function storageGet(key, fallback){
    try{
        const value = storage.get(key);
        if(value === undefined || value === null) return fallback;
        return value;
    }catch(e){
        return fallback;
    }
}

let usuarioAtual = null;
let context = storageGet("app_context", null);

if(!context || typeof context !== "object" || Array.isArray(context)){
    context = {};
}

let membros = storageGet("membros", []);
if(!Array.isArray(membros)){
    membros = [];
}

let ocorrencias = storageGet("ocorrencias", []);
if(!Array.isArray(ocorrencias)){
    ocorrencias = [];
}

let patrimonio = storageGet("patrimonio_igreja", []);
if(!Array.isArray(patrimonio)){
    patrimonio = [];
}

let editId = null;
let editPatrimonioId = null;

function ehAdminMatriz(){
    return context.usuario_tipo === "admin";
}

function podeAcessarSecretaria(){
    return ["admin", "pastor", "secretaria"].includes(context.usuario_tipo);
}

function getIgrejaVisualizadaId(){
    return ehAdminMatriz()
        ? (context.igreja_visualizada_id || "matriz")
        : context.igreja_origem_id;
}

function getIgrejaVisualizadaNome(){
    return ehAdminMatriz()
        ? (context.igreja_visualizada_nome || "Matriz")
        : context.igreja_origem_nome;
}

async function validarAcessoSecretaria(){
    try{
        const response = await fetch("http://127.0.0.1:5000/api/auth/me", {
            method: "GET",
            credentials: "include"
        });

        if(!response.ok){
            alert("Faça login para acessar a secretaria.");
            window.location.href = "../index.html";
            return false;
        }

        const usuario = await response.json();
        usuarioAtual = usuario;
        storage.set("usuario", usuario);

        if(!["admin", "pastor", "secretaria"].includes(usuario.tipo)){
            alert("Você não tem permissão para acessar a secretaria.");
            window.location.href = "../feed.html";
            return false;
        }

        context.usuario_tipo = usuario.tipo;
        context.igreja_origem_id = usuario.congregacao_id || "matriz";
        context.igreja_origem_nome = usuario.congregacao_id ? `Congregação ${usuario.congregacao_id}` : "Matriz";

        if(!context.igreja_visualizada_id){
            context.igreja_visualizada_id = context.igreja_origem_id;
        }

        if(!context.igreja_visualizada_nome){
            context.igreja_visualizada_nome = context.igreja_origem_nome;
        }

        storage.set("app_context", context);
        return true;

    }catch(error){
        alert("Não foi possível validar o acesso à secretaria.");
        window.location.href = "../index.html";
        return false;
    }
}

function garantirPermissao(){
    if(!podeAcessarSecretaria()){
        alert("Você não tem permissão para acessar a secretaria.");
        window.location.href = "../feed.html";
        return false;
    }

    if(!ehAdminMatriz() && !context.igreja_origem_id){
        alert("Igreja da sua conta não identificada.");
        window.location.href = "../feed.html";
        return false;
    }

    return true;
}

function normalizarTexto(valor){
    return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

function gerarId(){
    return Date.now().toString() + Math.floor(Math.random() * 1000).toString();
}

function escaparHTML(texto){
    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatarTelefone(numero){
    return String(numero || "").replace(/\D/g, "");
}

function obterMembrosVisiveis(){
    const igrejaId = getIgrejaVisualizadaId();
    return membros.filter(m => m.congregacao_id === igrejaId);
}

function obterOcorrenciasVisiveis(){
    const igrejaId = getIgrejaVisualizadaId();
    return ocorrencias.filter(o => o.congregacao_id === igrejaId);
}

function obterPatrimonioVisivel(){
    const igrejaId = getIgrejaVisualizadaId();
    return patrimonio.filter(item => item.congregacao_id === igrejaId);
}

function atualizarCabecalho(){
    document.getElementById("btnVoltar").style.display = ehAdminMatriz() ? "none" : "inline-block";
    document.getElementById("modoSistema").style.display = ehAdminMatriz() ? "inline-block" : "none";
    document.getElementById("thCongregacao").style.display = ehAdminMatriz() ? "table-cell" : "none";
    document.getElementById("thCongregacaoPatrimonio").style.display = ehAdminMatriz() ? "table-cell" : "none";

    const nomeIgreja = getIgrejaVisualizadaNome();

    document.getElementById("titulo").innerText = "📋 Secretaria - " + nomeIgreja;
    document.getElementById("subtitulo").innerText = ehAdminMatriz()
        ? "Visualizando secretaria de " + nomeIgreja + "."
        : "Gestão da secretaria da congregação " + nomeIgreja + ".";
}

function salvarMembro(){
    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const endereco = document.getElementById("endereco").value.trim();
    const cargo = document.getElementById("cargo").value;
    const batismo = document.getElementById("batismo").value;
    const entrada = document.getElementById("entrada").value;
    const desligamento = document.getElementById("desligamento").value;

    if(!nome){
        alert("Digite o nome do membro.");
        return;
    }

    let congregacaoIdRegistro = getIgrejaVisualizadaId();
    let congregacaoNomeRegistro = getIgrejaVisualizadaNome();

    if(editId){
        const atual = membros.find(item => item.id === editId);
        if(!atual) return;

        if(!ehAdminMatriz() && atual.congregacao_id !== context.igreja_origem_id){
            alert("Você não pode editar membros de outra congregação.");
            return;
        }

        congregacaoIdRegistro = atual.congregacao_id;
        congregacaoNomeRegistro = atual.congregacao_nome;
    }

    const membro = {
        id: editId || gerarId(),
        nome,
        telefone,
        endereco,
        cargo,
        batismo,
        entrada,
        desligamento,
        congregacao_id: congregacaoIdRegistro,
        congregacao_nome: congregacaoNomeRegistro,
        atualizado_em: new Date().toISOString()
    };

    if(editId){
        membros = membros.map(item => item.id === editId ? { ...item, ...membro } : item);
    }else{
        membro.criado_em = new Date().toISOString();
        membros.push(membro);
    }

    storage.set("membros", membros);
    cancelarEdicao();
    renderTabela();
}

function renderTabela(){
    const filtro = normalizarTexto(document.getElementById("busca").value);
    const tabela = document.getElementById("tabelaMembros");
    tabela.innerHTML = "";

    let lista = obterMembrosVisiveis();

    if(filtro){
        lista = lista.filter(m => {
            const alvo = [
                m.nome,
                m.telefone,
                m.cargo,
                m.congregacao_nome,
                m.endereco
            ].map(normalizarTexto).join(" ");

            return alvo.includes(filtro);
        });
    }

    let total = lista.length;
    let ativos = 0;
    let inativos = 0;

    lista
        .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"))
        .forEach(m => {
            const status = m.desligamento ? "Inativo" : "Ativo";
            status === "Ativo" ? ativos++ : inativos++;

            tabela.innerHTML += `
                <tr>
                    <td>${escaparHTML(m.nome)}</td>
                    <td>${escaparHTML(m.cargo || "-")}</td>
                    <td>
                        <button class="action-btn secondary" onclick="abrirWhats('${formatarTelefone(m.telefone)}')">📲 WhatsApp</button>
                        <button class="action-btn secondary" onclick="abrirMapa('${encodeURIComponent(m.endereco || "")}')">🗺️ Mapa</button>
                    </td>
                    <td class="${status === 'Ativo' ? 'ativo' : 'inativo'}">${status}</td>
                    ${ehAdminMatriz() ? `<td>${escaparHTML(m.congregacao_nome || "-")}</td>` : ""}
                    <td>
                        <button class="action-btn primary" onclick="editar('${m.id}')">✏️ Editar</button>
                        <button class="action-btn danger" onclick="deletar('${m.id}')">❌ Excluir</button>
                    </td>
                </tr>
            `;
        });

    if(!lista.length){
        tabela.innerHTML = `
            <tr>
                <td colspan="${ehAdminMatriz() ? 6 : 5}" class="empty">
                    Nenhum membro encontrado.
                </td>
            </tr>
        `;
    }

    document.getElementById("total").innerText = total;
    document.getElementById("ativos").innerText = ativos;
    document.getElementById("inativos").innerText = inativos;
}

function editar(id){
    const membro = membros.find(item => item.id === id);
    if(!membro) return;

    const igrejaPermitida = ehAdminMatriz() ? getIgrejaVisualizadaId() : context.igreja_origem_id;

    if(membro.congregacao_id !== igrejaPermitida){
        alert("Você não pode editar membros desta igreja.");
        return;
    }

    editId = id;

    document.getElementById("nome").value = membro.nome || "";
    document.getElementById("telefone").value = membro.telefone || "";
    document.getElementById("endereco").value = membro.endereco || "";
    document.getElementById("cargo").value = membro.cargo || "Membro";
    document.getElementById("batismo").value = membro.batismo || "";
    document.getElementById("entrada").value = membro.entrada || "";
    document.getElementById("desligamento").value = membro.desligamento || "";

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function deletar(id){
    const membro = membros.find(item => item.id === id);
    if(!membro) return;

    const igrejaPermitida = ehAdminMatriz() ? getIgrejaVisualizadaId() : context.igreja_origem_id;

    if(membro.congregacao_id !== igrejaPermitida){
        alert("Você não pode excluir membros desta igreja.");
        return;
    }

    const confirmar = confirm(`Excluir o membro "${membro.nome}"?`);
    if(!confirmar) return;

    membros = membros.filter(item => item.id !== id);
    storage.set("membros", membros);

    if(editId === id){
        cancelarEdicao();
    }

    renderTabela();
}

function cancelarEdicao(){
    editId = null;

    document.getElementById("nome").value = "";
    document.getElementById("telefone").value = "";
    document.getElementById("endereco").value = "";
    document.getElementById("cargo").value = "Membro";
    document.getElementById("batismo").value = "";
    document.getElementById("entrada").value = "";
    document.getElementById("desligamento").value = "";
}

function salvarOcorrencia(){
    const nome = document.getElementById("nomeOcorrencia").value.trim();
    const data = document.getElementById("dataOcorrencia").value;
    const descricao = document.getElementById("descricaoOcorrencia").value.trim();
    const status = document.getElementById("statusOcorrencia").value;

    if(!nome || !descricao){
        alert("Preencha o nome e a descrição da ocorrência.");
        return;
    }

    const ocorrencia = {
        id: gerarId(),
        nome,
        data,
        descricao,
        status,
        congregacao_id: getIgrejaVisualizadaId(),
        congregacao_nome: getIgrejaVisualizadaNome(),
        criado_em: new Date().toISOString()
    };

    ocorrencias.push(ocorrencia);
    storage.set("ocorrencias", ocorrencias);

    limparOcorrencia();
    renderOcorrencias();
}

function renderOcorrencias(){
    const lista = document.getElementById("listaOcorrencias");
    lista.innerHTML = "";

    const dados = obterOcorrenciasVisiveis()
        .sort((a, b) => new Date(b.criado_em || 0) - new Date(a.criado_em || 0));

    if(!dados.length){
        lista.innerHTML = `<div class="form-box empty">Nenhuma ocorrência registrada.</div>`;
        return;
    }

    dados.forEach(o => {
        const classeStatus = o.status === "sim" ? "status-pendente" : "status-ok";
        const textoStatus = o.status === "sim" ? "Disciplinado" : "Não disciplinado";

        lista.innerHTML += `
            <div class="ocorrencia">
                <h4>${escaparHTML(o.nome)}</h4>
                <p><strong>Data:</strong> ${escaparHTML(o.data || "-")}</p>
                <p><strong>Status:</strong> <span class="${classeStatus}">${textoStatus}</span></p>
                <p><strong>Congregação:</strong> ${escaparHTML(o.congregacao_nome || "-")}</p>
                <p><strong>Descrição:</strong> ${escaparHTML(o.descricao)}</p>
            </div>
        `;
    });
}

function salvarPatrimonio(){
    const nome = document.getElementById("patrimonioNome").value.trim();
    const categoria = document.getElementById("patrimonioCategoria").value;
    const quantidade = parseInt(document.getElementById("patrimonioQuantidade").value, 10);
    const estado = document.getElementById("patrimonioEstado").value;
    const data = document.getElementById("patrimonioData").value;
    const local = document.getElementById("patrimonioLocal").value.trim();
    const observacao = document.getElementById("patrimonioObservacao").value.trim();

    if(!nome){
        alert("Digite o nome do item do patrimônio.");
        return;
    }

    if(isNaN(quantidade) || quantidade <= 0){
        alert("Digite uma quantidade válida.");
        return;
    }

    let congregacaoIdRegistro = getIgrejaVisualizadaId();
    let congregacaoNomeRegistro = getIgrejaVisualizadaNome();

    if(editPatrimonioId){
        const atual = patrimonio.find(item => item.id === editPatrimonioId);
        if(!atual) return;

        const igrejaPermitida = ehAdminMatriz() ? getIgrejaVisualizadaId() : context.igreja_origem_id;

        if(atual.congregacao_id !== igrejaPermitida){
            alert("Você não pode editar patrimônio desta igreja.");
            return;
        }

        congregacaoIdRegistro = atual.congregacao_id;
        congregacaoNomeRegistro = atual.congregacao_nome;
    }

    const itemPatrimonio = {
        id: editPatrimonioId || gerarId(),
        nome,
        categoria,
        quantidade,
        estado,
        data,
        local,
        observacao,
        congregacao_id: congregacaoIdRegistro,
        congregacao_nome: congregacaoNomeRegistro,
        atualizado_em: new Date().toISOString()
    };

    if(editPatrimonioId){
        patrimonio = patrimonio.map(item => item.id === editPatrimonioId ? { ...item, ...itemPatrimonio } : item);
    }else{
        itemPatrimonio.criado_em = new Date().toISOString();
        patrimonio.push(itemPatrimonio);
    }

    storage.set("patrimonio_igreja", patrimonio);
    cancelarEdicaoPatrimonio();
    renderPatrimonio();
}

function renderPatrimonio(){
    const filtro = normalizarTexto(document.getElementById("buscaPatrimonio").value);
    const tabela = document.getElementById("tabelaPatrimonio");
    tabela.innerHTML = "";

    let lista = obterPatrimonioVisivel();

    if(filtro){
        lista = lista.filter(item => {
            const alvo = [
                item.nome,
                item.categoria,
                item.estado,
                item.local,
                item.congregacao_nome,
                item.observacao
            ].map(normalizarTexto).join(" ");

            return alvo.includes(filtro);
        });
    }

    lista
        .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"))
        .forEach(item => {
            let classeEstado = "estado-bom";
            if(item.estado === "Regular") classeEstado = "estado-regular";
            if(item.estado === "Ruim") classeEstado = "estado-ruim";

            tabela.innerHTML += `
                <tr>
                    <td>${escaparHTML(item.nome)}</td>
                    <td>${escaparHTML(item.categoria || "-")}</td>
                    <td>${escaparHTML(String(item.quantidade || 0))}</td>
                    <td class="${classeEstado}">${escaparHTML(item.estado || "-")}</td>
                    <td>${escaparHTML(item.local || "-")}</td>
                    <td>${escaparHTML(item.data || "-")}</td>
                    ${ehAdminMatriz() ? `<td>${escaparHTML(item.congregacao_nome || "-")}</td>` : ""}
                    <td>
                        <button class="action-btn primary" onclick="editarPatrimonio('${item.id}')">✏️ Editar</button>
                        <button class="action-btn danger" onclick="deletarPatrimonio('${item.id}')">🗑 Excluir</button>
                    </td>
                </tr>
            `;
        });

    if(!lista.length){
        tabela.innerHTML = `
            <tr>
                <td colspan="${ehAdminMatriz() ? 8 : 7}" class="empty">
                    Nenhum item de patrimônio encontrado.
                </td>
            </tr>
        `;
    }
}

function editarPatrimonio(id){
    const item = patrimonio.find(reg => reg.id === id);
    if(!item) return;

    const igrejaPermitida = ehAdminMatriz() ? getIgrejaVisualizadaId() : context.igreja_origem_id;

    if(item.congregacao_id !== igrejaPermitida){
        alert("Você não pode editar patrimônio desta igreja.");
        return;
    }

    editPatrimonioId = id;

    document.getElementById("patrimonioNome").value = item.nome || "";
    document.getElementById("patrimonioCategoria").value = item.categoria || "Móveis";
    document.getElementById("patrimonioQuantidade").value = item.quantidade || "";
    document.getElementById("patrimonioEstado").value = item.estado || "Bom";
    document.getElementById("patrimonioData").value = item.data || "";
    document.getElementById("patrimonioLocal").value = item.local || "";
    document.getElementById("patrimonioObservacao").value = item.observacao || "";

    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

function deletarPatrimonio(id){
    const item = patrimonio.find(reg => reg.id === id);
    if(!item) return;

    const igrejaPermitida = ehAdminMatriz() ? getIgrejaVisualizadaId() : context.igreja_origem_id;

    if(item.congregacao_id !== igrejaPermitida){
        alert("Você não pode excluir patrimônio desta igreja.");
        return;
    }

    const confirmar = confirm(`Excluir o item de patrimônio "${item.nome}"?`);
    if(!confirmar) return;

    patrimonio = patrimonio.filter(reg => reg.id !== id);
    storage.set("patrimonio_igreja", patrimonio);

    if(editPatrimonioId === id){
        cancelarEdicaoPatrimonio();
    }

    renderPatrimonio();
}

function cancelarEdicaoPatrimonio(){
    editPatrimonioId = null;
    document.getElementById("patrimonioNome").value = "";
    document.getElementById("patrimonioCategoria").value = "Móveis";
    document.getElementById("patrimonioQuantidade").value = "";
    document.getElementById("patrimonioEstado").value = "Bom";
    document.getElementById("patrimonioData").value = "";
    document.getElementById("patrimonioLocal").value = "";
    document.getElementById("patrimonioObservacao").value = "";
}

function voltarMatriz(){
    storage.set("app_context", {
        ...context,
        igreja_visualizada_id: "matriz",
        igreja_visualizada_nome: "Matriz"
    });
    window.location.href = "../feed.html";
}

function abrirWhats(numero){
    if(!numero){
        alert("Este membro não possui telefone cadastrado.");
        return;
    }

    window.open(`https://wa.me/${numero}`, "_blank");
}

function abrirMapa(endereco){
    if(!endereco){
        alert("Este membro não possui endereço cadastrado.");
        return;
    }

    window.open(`https://www.google.com/maps/search/${endereco}`, "_blank");
}

function limparOcorrencia(){
    document.getElementById("nomeOcorrencia").value = "";
    document.getElementById("dataOcorrencia").value = "";
    document.getElementById("descricaoOcorrencia").value = "";
    document.getElementById("statusOcorrencia").value = "nao";
}

async function iniciarSecretaria(){
    const acessoLiberado = await validarAcessoSecretaria();
    if(!acessoLiberado) return;

    if(!garantirPermissao()) return;

    atualizarCabecalho();
    renderTabela();
    renderOcorrencias();
    renderPatrimonio();
}

iniciarSecretaria();
</script>
