<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Feed - IECA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef2f7;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color:#1f2937;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.topo h2{
    margin:0;
    font-size:28px;
    color:#0f172a;
}

.topo-left{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.topo-subtitulo{
    color:#64748b;
    font-size:14px;
    margin:0;
}

.topo-badges{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:4px;
}

.badge-info{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.badge-dep{
    display:inline-block;
    background:#ede9fe;
    color:#6d28d9;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

#btnVoltarMatriz{
    background:#1e293b;
    color:#fff;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    display:none;
}

#btnVoltarMatriz:hover{
    opacity:.92;
}

.container{
    max-width:900px;
    width:100%;
}

.live-box{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
    background:#fff;
    padding:14px 16px;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
    flex-wrap:wrap;
}

.live-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.live-text{
    color:#dc2626;
    font-weight:bold;
}

.message-container{
    margin-top:10px;
    margin-bottom:20px;
    position:relative;
}

.message-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:#1e1e2f;
    border-radius:50px;
    padding:8px 10px;
    box-shadow:0 6px 16px rgba(0,0,0,0.15);
}

.message-box input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    color:#fff;
    padding:12px;
    font-size:15px;
}

.message-box input::placeholder{
    color:#cbd5e1;
}

.btn-plus,
.btn-send{
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    flex-shrink:0;
}

.btn-plus{
    background:#2a2a40;
    color:#fff;
}

.btn-send{
    background:#16a34a;
    color:white;
}

.upload-menu{
    position:absolute;
    bottom:60px;
    right:100%;
    margin-right:10px;
    background:#2a2a40;
    border-radius:10px;
    padding:8px;
    display:none;
    flex-direction:column;
}

.upload-menu button{
    background:none;
    border:none;
    color:black;
    padding:10px;
    cursor:pointer;
    text-align:left;
    border-radius:8px;
}

.upload-menu button:hover{
    background:rgba(255,255,255,0.08);
}

.file-preview{
    margin-top:12px;
    background:#fff;
    padding:12px 14px;
    border-radius:12px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.file-preview span{
    color:#334155;
    font-size:14px;
    word-break:break-word;
}

.file-preview button{
    background:#ef4444;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.post{
    background:white;
    padding:16px;
    border-radius:14px;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
}

.post-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

.post-tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.post-igreja{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.post-departamento{
    display:inline-block;
    background:#ede9fe;
    color:#6d28d9;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.post-data{
    color:#64748b;
    font-size:12px;
}

.post p{
    margin:0 0 12px;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.5;
}

.post-media img,
.post-media video{
    width:100%;
    border-radius:12px;
    margin-top:8px;
    max-height:420px;
    object-fit:cover;
    background:#e5e7eb;
}

.post-media a{
    display:inline-block;
    margin-top:8px;
    color:#2563eb;
    font-weight:600;
    text-decoration:none;
}

.post-media a:hover{
    text-decoration:underline;
}

.empty-feed{
    background:#fff;
    padding:24px;
    border-radius:14px;
    text-align:center;
    color:#64748b;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
}

.btn-limpar-dep{
    background:#6b7280;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

@media(max-width:768px){
    .topo h2{
        font-size:22px;
    }

    .message-box{
        padding:6px 8px;
    }

    .btn-plus,
    .btn-send{
        width:40px;
        height:40px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <h2>IECA</h2>

        <ul>
            <li class="active" onclick="window.location.href='feed.html'">
                <i class="fas fa-home"></i> Feed
            </li>

            <li onclick="window.location.href='pages/congregacao.html'">
                <i class="fas fa-church"></i> Congregações
            </li>

            <li onclick="window.location.href='pages/departamento.html'">
                <i class="fas fa-users"></i> Departamentos
            </li>

            <li onclick="window.location.href='pages/secretaria.html'">
                <i class="fas fa-file-alt"></i> Secretaria
            </li>

            <li onclick="window.location.href='pages/financeiro.html'">
                <i class="fas fa-coins"></i> Financeiro
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topo">
            <div class="topo-left">
                <h2 id="tituloPagina">📢 Feed</h2>
                <p id="subtituloPagina" class="topo-subtitulo"></p>

                <div class="topo-badges">
                    <span id="badgeMatriz" class="badge-info" style="display:none;">VISÃO MATRIZ</span>
                    <span id="badgeDepartamento" class="badge-dep" style="display:none;"></span>
                </div>
            </div>

            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button id="btnLimparDepartamento" class="btn-limpar-dep" style="display:none;" onclick="limparDepartamento()">Limpar departamento</button>
                <button id="btnVoltarMatriz" onclick="voltarMatriz()">⬅️ Voltar para Matriz</button>
            </div>
        </header>

        <div class="container">
           <div id="areaMatriz" class="live-box">
    <a href="https://youtube.com/@IECAUMAIGREJAFAMILIA" target="_blank">
        <button class="live-btn">▶ YouTube</button>
    </a>
    <span id="liveStatus" class="live-text"></span>
</div>

            <div class="message-container">
                <div class="message-box">
                    <button class="btn-plus" onclick="toggleMenu()">+</button>
                    <input type="text" id="texto" placeholder="Escreva uma mensagem...">
                    <button class="btn-send" onclick="criarPost()">➤</button>
                </div>

                <div class="upload-menu" id="uploadMenu">
                    <button onclick="selecionarArquivo('image/*')">📷 Foto</button>
                    <button onclick="selecionarArquivo('video/*')">🎥 Vídeo</button>
                    <button onclick="selecionarArquivo('.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt')">📄 Documento</button>
                </div>

                <input type="file" id="midia" hidden>

                <div id="filePreview" class="file-preview">
                    <span id="filePreviewText">Nenhum arquivo selecionado</span>
                    <button onclick="removerArquivo()">Remover</button>
                </div>
            </div>

            <section id="feed"></section>
        </div>
    </main>
</div>

<script src="js/services/storage.js"></script>

<script>
const nomesDepartamentos = {
    missoes: "Missões",
    mulheres: "Mulheres",
    homens: "Homens",
    jovens: "Jovens",
    infantil: "Infantil",
    diaconato: "Diaconato",
    coral: "Coral",
    intercessao: "Intercessão",
    social: "Social",
    estudos: "Estudos"
};

let context = storage.get("app_context", null);

if(!context || typeof context !== "object" || Array.isArray(context) || !context.tipo){
    context = {
        tipo: "matriz",
        nome: "Matriz",
        congregacao_id: null,
        departamento: null,
        departamento_nome: null
    };
    storage.set("app_context", context);
}

let posts = storage.get("posts", []);
if(!Array.isArray(posts)) posts = [];

let arquivoSelecionado = null;

function isMatriz(){
    return context.tipo === "matriz";
}

function gerarId(){
    return Date.now().toString() + Math.floor(Math.random() * 1000).toString();
}

function escaparHTML(texto){
    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatarData(dataISO){
    if(!dataISO) return "";
    const data = new Date(dataISO);
    if(isNaN(data.getTime())) return "";
    return data.toLocaleString("pt-BR");
}

function atualizarTitulo(){
    const departamentoAtivo = context.departamento_nome || nomesDepartamentos[context.departamento] || "";

    document.getElementById("tituloPagina").innerText =
        departamentoAtivo
            ? `📢 Feed - ${context.nome || "IECA"} / ${departamentoAtivo}`
            : `📢 Feed - ${context.nome || "IECA"}`;

    document.getElementById("subtituloPagina").innerText = isMatriz()
        ? (departamentoAtivo
            ? `Visão geral do departamento ${departamentoAtivo} em todas as congregações.`
            : "Visão geral de publicações de todas as congregações.")
        : (departamentoAtivo
            ? `Publicações da congregação ${context.nome || ""} no departamento ${departamentoAtivo}.`
            : `Publicações da congregação ${context.nome || ""}.`);

    document.getElementById("badgeMatriz").style.display = isMatriz() ? "inline-block" : "none";

    const badgeDepartamento = document.getElementById("badgeDepartamento");
    if(departamentoAtivo){
        badgeDepartamento.style.display = "inline-block";
        badgeDepartamento.innerText = departamentoAtivo;
        document.getElementById("btnLimparDepartamento").style.display = "inline-block";
    }else{
        badgeDepartamento.style.display = "none";
        badgeDepartamento.innerText = "";
        document.getElementById("btnLimparDepartamento").style.display = "none";
    }
}

function controlarBotaoMatriz(){
    document.getElementById("btnVoltarMatriz").style.display =
        isMatriz() ? "none" : "inline-block";
}

function controlarAreaMatriz(){
    document.getElementById("areaMatriz").style.display =
        isMatriz() ? "flex" : "none";
}

function voltarMatriz(){
    const novo = {
        tipo: "matriz",
        nome: "Matriz",
        congregacao_id: null,
        departamento: null,
        departamento_nome: null
    };

    storage.set("app_context", novo);
    window.location.href = "feed.html";
}

function limparDepartamento(){
    const novoContexto = {
        ...context,
        departamento: null,
        departamento_nome: null
    };

    storage.set("app_context", novoContexto);
    window.location.href = "feed.html";
}

function getPostsFiltrados(){
    let lista = [...posts];

    if(!isMatriz()){
        lista = lista.filter(p => p.congregacao_id === context.congregacao_id);
    }

    if(context.departamento){
        lista = lista.filter(p => p.departamento === context.departamento);
    }

    return lista;
}

function criarPost(){
    const texto = document.getElementById("texto").value.trim();

    if(!texto && !arquivoSelecionado){
        alert("Escreva uma mensagem ou selecione um arquivo.");
        return;
    }

    const postBase = {
        id: gerarId(),
        texto,
        data: new Date().toISOString(),
        congregacao_id: context.congregacao_id,
        congregacao_nome: context.nome || "Matriz",
        departamento: context.departamento || null,
        departamento_nome: context.departamento_nome || null,
        arquivo: null
    };

    if(arquivoSelecionado){
        const reader = new FileReader();

        reader.onload = function(e){
            postBase.arquivo = {
                nome: arquivoSelecionado.name,
                tipo: arquivoSelecionado.type,
                url: e.target.result
            };

            posts.push(postBase);
            storage.set("posts", posts);
            limparComposer();
            render();
        };

        reader.readAsDataURL(arquivoSelecionado);
        return;
    }

    posts.push(postBase);
    storage.set("posts", posts);
    limparComposer();
    render();
}

function renderMidia(arquivo){
    if(!arquivo || !arquivo.url) return "";

    const tipo = arquivo.tipo || "";
    const nome = escaparHTML(arquivo.nome || "arquivo");

    if(tipo.startsWith("image/")){
        return `
            <div class="post-media">
                <img src="${arquivo.url}" alt="${nome}">
            </div>
        `;
    }

    if(tipo.startsWith("video/")){
        return `
            <div class="post-media">
                <video controls>
                    <source src="${arquivo.url}" type="${tipo}">
                    Seu navegador não suporta vídeo.
                </video>
            </div>
        `;
    }

    return `
        <div class="post-media">
            <a href="${arquivo.url}" download="${nome}">📄 Baixar ${nome}</a>
        </div>
    `;
}

function render(){
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    const lista = getPostsFiltrados()
        .sort((a, b) => new Date(b.data || 0) - new Date(a.data || 0));

    if(!lista.length){
        feed.innerHTML = `
            <div class="empty-feed">
                Nenhuma publicação encontrada para este feed.
            </div>
        `;
        return;
    }

    lista.forEach(p => {
        feed.innerHTML += `
            <div class="post">
                <div class="post-header">
                    <div class="post-tags">
                        <span class="post-igreja">${escaparHTML(p.congregacao_nome || "Sem congregação")}</span>
                        ${p.departamento_nome ? `<span class="post-departamento">${escaparHTML(p.departamento_nome)}</span>` : ""}
                    </div>
                    <span class="post-data">${formatarData(p.data)}</span>
                </div>

                ${p.texto ? `<p>${escaparHTML(p.texto)}</p>` : ""}
                ${renderMidia(p.arquivo)}
            </div>
        `;
    });
}

function verificarLive(){
    const live = storage.get("live", {});
    document.getElementById("liveStatus").innerText =
        live && live.ativo ? "🔴 AO VIVO AGORA" : "Nenhuma transmissão ao vivo no momento";
}

function abrirYoutube(){
    window.open("https://youtube.com/@SEUCANAL", "_blank");
}

function toggleMenu(){
    const menu = document.getElementById("uploadMenu");
    menu.style.display = menu.style.display === "flex" ? "none" : "flex";
}

function selecionarArquivo(accept){
    const input = document.getElementById("midia");
    input.accept = accept;
    document.getElementById("uploadMenu").style.display = "none";
    input.click();
}

document.getElementById("midia").addEventListener("change", function(event){
    const arquivo = event.target.files[0];

    if(!arquivo){
        arquivoSelecionado = null;
        atualizarPreviewArquivo();
        return;
    }

    arquivoSelecionado = arquivo;
    atualizarPreviewArquivo();
});

function atualizarPreviewArquivo(){
    const preview = document.getElementById("filePreview");
    const texto = document.getElementById("filePreviewText");

    if(!arquivoSelecionado){
        preview.style.display = "none";
        texto.innerText = "Nenhum arquivo selecionado";
        return;
    }

    preview.style.display = "flex";
    texto.innerText = `Arquivo selecionado: ${arquivoSelecionado.name}`;
}

function removerArquivo(){
    arquivoSelecionado = null;
    document.getElementById("midia").value = "";
    atualizarPreviewArquivo();
}

function limparComposer(){
    document.getElementById("texto").value = "";
    document.getElementById("midia").value = "";
    arquivoSelecionado = null;
    document.getElementById("uploadMenu").style.display = "none";
    atualizarPreviewArquivo();
}

document.addEventListener("click", function(event){
    const menu = document.getElementById("uploadMenu");
    const plus = document.querySelector(".btn-plus");

    if(!menu.contains(event.target) && !plus.contains(event.target)){
        menu.style.display = "none";
    }
});

controlarBotaoMatriz();
atualizarTitulo();
controlarAreaMatriz();
render();
verificarLive();
</script>

</body>
</html>
