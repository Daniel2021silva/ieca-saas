<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Secretaria - IECA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
.status-box{display:none;margin:12px 0;padding:12px;border-radius:10px}
.status-box.show{display:block}
.status-success{background:#ecfff2;color:#166534}
.status-error{background:#fff1f2;color:#991b1b}
.status-info{background:#eff6ff;color:#1d4ed8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:white;padding:16px;border-radius:14px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
input,select,textarea{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px}
textarea{min-height:90px}
button{padding:10px 12px;border:0;border-radius:8px;cursor:pointer;font-weight:700}
.primary{background:#2563eb;color:white}
.danger{background:#dc2626;color:white}
.secondary{background:#e5e7eb;color:#111827}
.action-btn{margin:2px}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}
.ativo{color:#16a34a;font-weight:700}
.inativo{color:#dc2626;font-weight:700}
.empty{text-align:center;color:#64748b}
.oculto{display:none!important}
.ocorrencia{background:#f8fafc;padding:12px;border-radius:10px;margin-bottom:10px}
.status-pendente{color:#dc2626;font-weight:700}
.status-ok{color:#16a34a;font-weight:700}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.resumo div{background:white;padding:14px;border-radius:12px;text-align:center}
.resumo strong{font-size:24px;display:block}
</style>
</head>

<body>
<button class="menu-toggle" id="menuToggle">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">
<aside class="sidebar" id="sidebar">
    <h2>IECA</h2>
    <ul>
        <li onclick="window.location.href='../feed.html'"><i class="fas fa-home"></i> Feed</li>
        <li onclick="window.location.href='congregacao.html'"><i class="fas fa-church"></i> Congregações</li>
        <li onclick="window.location.href='departamento.html'"><i class="fas fa-users"></i> Departamentos</li>
        <li class="active"><i class="fas fa-file-alt"></i> Secretaria</li>
        <li onclick="window.location.href='financeiro.html'"><i class="fas fa-coins"></i> Financeiro</li>
        <li onclick="window.location.href='usuarios.html'"><i class="fas fa-user-cog"></i> Usuários</li>
    </ul>
</aside>

<main class="main-content">
<header class="topo">
    <div>
        <h2 id="titulo">📋 Secretaria</h2>
        <p id="subtitulo">Gestão da secretaria.</p>
    </div>
    <div>
        <span id="topoUser"></span>
        <button class="secondary" onclick="voltarFeed()">Voltar</button>
    </div>
</header>

<div class="container">
<div id="statusBox" class="status-box"></div>

<div class="resumo">
    <div><strong id="total">0</strong>Total</div>
    <div><strong id="ativos">0</strong>Ativos</div>
    <div><strong id="inativos">0</strong>Inativos</div>
</div>

<div class="card">
<h3>Cadastro de Membros</h3>
<div class="grid">
    <input id="nome" placeholder="Nome do membro">
    <input id="telefone" placeholder="Telefone">
    <input id="endereco" placeholder="Endereço">
    <select id="cargo">
        <option>Membro</option>
        <option>Obreiro</option>
        <option>Diácono</option>
        <option>Presbítero</option>
        <option>Pastor</option>
    </select>
    <input id="batismo" type="date">
    <input id="entrada" type="date">
    <input id="desligamento" type="date">
</div>
<button class="primary" onclick="salvarMembro()">Salvar membro</button>
<button class="secondary" onclick="cancelarEdicao()">Limpar</button>
</div>

<div class="card">
<h3>Membros</h3>
<input id="busca" placeholder="Buscar membro..." oninput="renderTabela()">
<div class="table-wrapper">
<table>
<thead>
<tr>
    <th>Nome</th>
    <th>Cargo</th>
    <th>Contato</th>
    <th>Status</th>
    <th id="thCongregacao" class="oculto">Congregação</th>
    <th>Ações</th>
</tr>
</thead>
<tbody id="tabelaMembros"></tbody>
</table>
</div>
</div>

<div class="card">
<h3>Ocorrências</h3>
<input id="nomeOcorrencia" placeholder="Nome do membro">
<select id="statusOcorrencia">
    <option value="nao">Não disciplinado</option>
    <option value="sim">Disciplinado</option>
</select>
<textarea id="descricaoOcorrencia" placeholder="Descrição da ocorrência"></textarea>
<button class="primary" onclick="salvarOcorrencia()">Registrar ocorrência</button>
<button class="secondary" onclick="limparOcorrencia()">Limpar</button>
<div id="listaOcorrencias" style="margin-top:15px"></div>
</div>

<div class="card">
<h3>Patrimônio</h3>
<div class="grid">
    <input id="patrimonioNome" placeholder="Nome do item">
    <select id="patrimonioCategoria">
        <option>Móveis</option>
        <option>Som</option>
        <option>Instrumentos</option>
        <option>Equipamentos</option>
        <option>Outros</option>
    </select>
    <input id="patrimonioQuantidade" type="number" placeholder="Quantidade">
</div>
<button class="primary" onclick="salvarPatrimonio()">Salvar patrimônio</button>
<button class="secondary" onclick="cancelarEdicaoPatrimonio()">Limpar</button>

<input id="buscaPatrimonio" placeholder="Buscar patrimônio..." oninput="renderPatrimonio()" style="margin-top:15px">

<div class="table-wrapper">
<table>
<thead>
<tr>
    <th>Nome</th>
    <th>Categoria</th>
    <th>Qtd</th>
    <th id="thCongregacaoPatrimonio" class="oculto">Congregação</th>
    <th>Ações</th>
</tr>
</thead>
<tbody id="tabelaPatrimonio"></tbody>
</table>
</div>
</div>
</div>
</main>
</div>

<script type="module">
import { supabase } from "../js/services/supabase.js";
import { getUsuarioAtual } from "../js/modules/auth.js";

let usuarioAtual = null;
let membros = [];
let ocorrencias = [];
let patrimonio = [];
let editId = null;
let editPatrimonioId = null;

function mostrarMensagem(texto, tipo = "info"){
    const box = document.getElementById("statusBox");
    box.className = "status-box show";
    if(tipo === "success") box.classList.add("status-success");
    else if(tipo === "error") box.classList.add("status-error");
    else box.classList.add("status-info");
    box.textContent = texto;
}

function escaparHTML(texto){
    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function normalizarTexto(valor){
    return String(valor || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

function formatarTelefone(numero){
    return String(numero || "").replace(/\D/g, "");
}

function formatarDataHora(dataISO){
    if(!dataISO) return "";
    const data = new Date(dataISO);
    if(isNaN(data.getTime())) return "";
    return data.toLocaleString("pt-BR");
}

function ehAdmin(){
    return usuarioAtual && usuarioAtual.tipo === "matriz_admin";
}

window.voltarFeed = function(){
    window.location.href = "../feed.html";
};

async function verificarSessao(){
    usuarioAtual = await getUsuarioAtual();

    if(!usuarioAtual){
        window.location.href = "../index.html";
        return false;
    }

    if(!["matriz_admin", "pastor", "secretaria"].includes(usuarioAtual.tipo)){
        alert("Você não tem permissão para acessar a secretaria.");
        window.location.href = "../feed.html";
        return false;
    }

    return true;
}

function atualizarCabecalho(){
    const nomeIgreja = usuarioAtual?.congregacao_nome || "Matriz";
    document.getElementById("titulo").innerText = `📋 Secretaria - ${nomeIgreja}`;
    document.getElementById("subtitulo").innerText = ehAdmin()
        ? "Gestão geral da secretaria."
        : `Gestão da secretaria da congregação ${nomeIgreja}.`;
    document.getElementById("topoUser").innerText = `${usuarioAtual.nome} • ${usuarioAtual.tipo}`;
    document.getElementById("thCongregacao").classList.toggle("oculto", !ehAdmin());
    document.getElementById("thCongregacaoPatrimonio").classList.toggle("oculto", !ehAdmin());
}

async function carregarMembros(){
    const { data, error } = await supabase
        .from("membros")
        .select("*")
        .order("nome", { ascending: true });

    if(error) throw new Error(error.message || "Erro ao carregar membros.");
    membros = data || [];
}

async function carregarOcorrencias(){
    const { data, error } = await supabase
        .from("ocorrencias")
        .select("*")
        .order("criado_em", { ascending: false });

    if(error) throw new Error(error.message || "Erro ao carregar ocorrências.");
    ocorrencias = data || [];
}

async function carregarPatrimonio(){
    const { data, error } = await supabase
        .from("patrimonio")
        .select("*")
        .order("nome", { ascending: true });

    if(error) throw new Error(error.message || "Erro ao carregar patrimônio.");
    patrimonio = data || [];
}

function renderTabela(){
    const filtro = normalizarTexto(document.getElementById("busca").value);
    const tabela = document.getElementById("tabelaMembros");
    tabela.innerHTML = "";

    let lista = [...membros];

    if(filtro){
        lista = lista.filter(m =>
            [m.nome, m.telefone, m.cargo, m.congregacao_nome]
            .map(normalizarTexto)
            .join(" ")
            .includes(filtro)
        );
    }

    let total = lista.length;
    let ativos = 0;
    let inativos = 0;

    lista.forEach(m => {
        const status = m.status || (m.desligamento ? "Inativo" : "Ativo");
        status === "Ativo" ? ativos++ : inativos++;

        tabela.innerHTML += `
            <tr>
                <td>${escaparHTML(m.nome)}</td>
                <td>${escaparHTML(m.cargo || "-")}</td>
                <td>
                    <button class="action-btn secondary" onclick="abrirWhats('${formatarTelefone(m.telefone)}')">📲 WhatsApp</button>
                    <button class="action-btn secondary" onclick="abrirMapa('${encodeURIComponent(m.endereco || "")}')">🗺️ Mapa</button>
                </td>
                <td class="${status === 'Ativo' ? 'ativo' : 'inativo'}">${escaparHTML(status)}</td>
                ${ehAdmin() ? `<td>${escaparHTML(m.congregacao_nome || "-")}</td>` : ""}
                <td>
                    <button class="action-btn primary" onclick="editar('${m.id}')">✏️ Editar</button>
                    <button class="action-btn danger" onclick="deletar('${m.id}')">❌ Excluir</button>
                </td>
            </tr>
        `;
    });

    if(!lista.length){
        tabela.innerHTML = `<tr><td colspan="${ehAdmin() ? 6 : 5}" class="empty">Nenhum membro encontrado.</td></tr>`;
    }

    document.getElementById("total").innerText = total;
    document.getElementById("ativos").innerText = ativos;
    document.getElementById("inativos").innerText = inativos;
}

function renderOcorrencias(){
    const lista = document.getElementById("listaOcorrencias");
    lista.innerHTML = "";

    if(!ocorrencias.length){
        lista.innerHTML = `<div class="empty">Nenhuma ocorrência registrada.</div>`;
        return;
    }

    ocorrencias.forEach(o => {
        const disciplinado = o.status === "sim";
        lista.innerHTML += `
            <div class="ocorrencia">
                <h4>${escaparHTML(o.nome_membro)}</h4>
                <p><strong>Status:</strong> <span class="${disciplinado ? "status-pendente" : "status-ok"}">${disciplinado ? "Disciplinado" : "Não disciplinado"}</span></p>
                <p><strong>Descrição:</strong> ${escaparHTML(o.descricao)}</p>
                <p><strong>Registro:</strong> ${escaparHTML(formatarDataHora(o.criado_em) || "-")}</p>
                <button class="action-btn danger" onclick="deletarOcorrencia('${o.id}')">Excluir ocorrência</button>
            </div>
        `;
    });
}

function renderPatrimonio(){
    const filtro = normalizarTexto(document.getElementById("buscaPatrimonio").value);
    const tabela = document.getElementById("tabelaPatrimonio");
    tabela.innerHTML = "";

    let lista = [...patrimonio];

    if(filtro){
        lista = lista.filter(item =>
            [item.nome, item.categoria, item.congregacao_nome]
            .map(normalizarTexto)
            .join(" ")
            .includes(filtro)
        );
    }

    lista.forEach(item => {
        tabela.innerHTML += `
            <tr>
                <td>${escaparHTML(item.nome)}</td>
                <td>${escaparHTML(item.categoria || "-")}</td>
                <td>${escaparHTML(String(item.quantidade || 0))}</td>
                ${ehAdmin() ? `<td>${escaparHTML(item.congregacao_nome || "-")}</td>` : ""}
                <td>
                    <button class="action-btn primary" onclick="editarPatrimonio('${item.id}')">✏️ Editar</button>
                    <button class="action-btn danger" onclick="deletarPatrimonio('${item.id}')">🗑 Excluir</button>
                </td>
            </tr>
        `;
    });

    if(!lista.length){
        tabela.innerHTML = `<tr><td colspan="${ehAdmin() ? 5 : 4}" class="empty">Nenhum item encontrado.</td></tr>`;
    }
}

window.salvarMembro = async function(){
    const payload = {
        nome: document.getElementById("nome").value.trim(),
        telefone: document.getElementById("telefone").value.trim(),
        endereco: document.getElementById("endereco").value.trim(),
        cargo: document.getElementById("cargo").value,
        batismo: document.getElementById("batismo").value || null,
        entrada: document.getElementById("entrada").value || null,
        desligamento: document.getElementById("desligamento").value || null,
        congregacao_id: usuarioAtual.congregacao_id || null,
        congregacao_nome: usuarioAtual.congregacao_nome || "Matriz"
    };

    if(!payload.nome){
        mostrarMensagem("Digite o nome do membro.", "error");
        return;
    }

    let result;

    if(editId){
        result = await supabase.from("membros").update(payload).eq("id", editId);
    }else{
        result = await supabase.from("membros").insert([payload]);
    }

    if(result.error){
        mostrarMensagem(result.error.message, "error");
        return;
    }

    const estavaEditando = !!editId;
    cancelarEdicao();
    await carregarMembros();
    renderTabela();
    mostrarMensagem(estavaEditando ? "Membro atualizado com sucesso." : "Membro cadastrado com sucesso.", "success");
};

window.editar = function(id){
    const membro = membros.find(item => String(item.id) === String(id));
    if(!membro) return;

    editId = id;
    document.getElementById("nome").value = membro.nome || "";
    document.getElementById("telefone").value = membro.telefone || "";
    document.getElementById("endereco").value = membro.endereco || "";
    document.getElementById("cargo").value = membro.cargo || "Membro";
    document.getElementById("batismo").value = membro.batismo || "";
    document.getElementById("entrada").value = membro.entrada || "";
    document.getElementById("desligamento").value = membro.desligamento || "";
    window.scrollTo({ top: 0, behavior: "smooth" });
};

window.deletar = async function(id){
    const membro = membros.find(item => String(item.id) === String(id));
    if(!membro) return;
    if(!confirm(`Excluir o membro "${membro.nome}"?`)) return;

    const { error } = await supabase.from("membros").delete().eq("id", id);

    if(error){
        mostrarMensagem(error.message, "error");
        return;
    }

    if(String(editId) === String(id)) cancelarEdicao();
    await carregarMembros();
    renderTabela();
    mostrarMensagem("Membro excluído com sucesso.", "success");
};

window.cancelarEdicao = function(){
    editId = null;
    document.getElementById("nome").value = "";
    document.getElementById("telefone").value = "";
    document.getElementById("endereco").value = "";
    document.getElementById("cargo").value = "Membro";
    document.getElementById("batismo").value = "";
    document.getElementById("entrada").value = "";
    document.getElementById("desligamento").value = "";
};

window.salvarOcorrencia = async function(){
    const payload = {
        nome_membro: document.getElementById("nomeOcorrencia").value.trim(),
        descricao: document.getElementById("descricaoOcorrencia").value.trim(),
        status: document.getElementById("statusOcorrencia").value,
        usuario_id: usuarioAtual.id,
        congregacao_id: usuarioAtual.congregacao_id || null,
        congregacao_nome: usuarioAtual.congregacao_nome || "Matriz"
    };

    if(!payload.nome_membro || !payload.descricao){
        mostrarMensagem("Preencha o nome e a descrição.", "error");
        return;
    }

    const { error } = await supabase.from("ocorrencias").insert([payload]);

    if(error){
        mostrarMensagem(error.message, "error");
        return;
    }

    limparOcorrencia();
    await carregarOcorrencias();
    renderOcorrencias();
    mostrarMensagem("Ocorrência registrada com sucesso.", "success");
};

window.deletarOcorrencia = async function(id){
    if(!confirm("Excluir esta ocorrência?")) return;

    const { error } = await supabase.from("ocorrencias").delete().eq("id", id);

    if(error){
        mostrarMensagem(error.message, "error");
        return;
    }

    await carregarOcorrencias();
    renderOcorrencias();
    mostrarMensagem("Ocorrência excluída com sucesso.", "success");
};

window.limparOcorrencia = function(){
    document.getElementById("nomeOcorrencia").value = "";
    document.getElementById("descricaoOcorrencia").value = "";
    document.getElementById("statusOcorrencia").value = "nao";
};

window.salvarPatrimonio = async function(){
    const quantidade = parseInt(document.getElementById("patrimonioQuantidade").value, 10);

    const payload = {
        nome: document.getElementById("patrimonioNome").value.trim(),
        categoria: document.getElementById("patrimonioCategoria").value,
        quantidade: isNaN(quantidade) ? 0 : quantidade,
        congregacao_id: usuarioAtual.congregacao_id || null,
        congregacao_nome: usuarioAtual.congregacao_nome || "Matriz"
    };

    if(!payload.nome){
        mostrarMensagem("Digite o nome do item.", "error");
        return;
    }

    if(payload.quantidade <= 0){
        mostrarMensagem("Digite uma quantidade válida.", "error");
        return;
    }

    let result;

    if(editPatrimonioId){
        result = await supabase.from("patrimonio").update(payload).eq("id", editPatrimonioId);
    }else{
        result = await supabase.from("patrimonio").insert([payload]);
    }

    if(result.error){
        mostrarMensagem(result.error.message, "error");
        return;
    }

    const estavaEditando = !!editPatrimonioId;
    cancelarEdicaoPatrimonio();
    await carregarPatrimonio();
    renderPatrimonio();
    mostrarMensagem(estavaEditando ? "Patrimônio atualizado." : "Patrimônio salvo.", "success");
};

window.editarPatrimonio = function(id){
    const item = patrimonio.find(reg => String(reg.id) === String(id));
    if(!item) return;

    editPatrimonioId = id;
    document.getElementById("patrimonioNome").value = item.nome || "";
    document.getElementById("patrimonioCategoria").value = item.categoria || "Móveis";
    document.getElementById("patrimonioQuantidade").value = item.quantidade || "";
};

window.deletarPatrimonio = async function(id){
    const item = patrimonio.find(reg => String(reg.id) === String(id));
    if(!item) return;
    if(!confirm(`Excluir o item "${item.nome}"?`)) return;

    const { error } = await supabase.from("patrimonio").delete().eq("id", id);

    if(error){
        mostrarMensagem(error.message, "error");
        return;
    }

    if(String(editPatrimonioId) === String(id)) cancelarEdicaoPatrimonio();
    await carregarPatrimonio();
    renderPatrimonio();
    mostrarMensagem("Patrimônio excluído com sucesso.", "success");
};

window.cancelarEdicaoPatrimonio = function(){
    editPatrimonioId = null;
    document.getElementById("patrimonioNome").value = "";
    document.getElementById("patrimonioCategoria").value = "Móveis";
    document.getElementById("patrimonioQuantidade").value = "";
};

window.abrirWhats = function(numero){
    if(!numero){
        mostrarMensagem("Este membro não possui telefone cadastrado.", "info");
        return;
    }
    window.open(`https://wa.me/55${numero}`, "_blank", "noopener,noreferrer");
};

window.abrirMapa = function(endereco){
    if(!endereco){
        mostrarMensagem("Este membro não possui endereço cadastrado.", "info");
        return;
    }
    window.open(`https://www.google.com/maps/search/${endereco}`, "_blank", "noopener,noreferrer");
};

const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const sidebarOverlay = document.getElementById("sidebarOverlay");

if(menuToggle && sidebar && sidebarOverlay){
    menuToggle.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        sidebarOverlay.classList.toggle("show");
    });

    sidebarOverlay.addEventListener("click", () => {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("show");
    });
}

async function iniciarSecretaria(){
    const acessoLiberado = await verificarSessao();
    if(!acessoLiberado) return;

    atualizarCabecalho();

    try{
        await Promise.all([
            carregarMembros(),
            carregarOcorrencias(),
            carregarPatrimonio()
        ]);

        renderTabela();
        renderOcorrencias();
        renderPatrimonio();
    }catch(error){
        mostrarMensagem(error.message || "Erro ao carregar dados da secretaria.", "error");
    }
}

iniciarSecretaria();
</script>

</body>
</html>
