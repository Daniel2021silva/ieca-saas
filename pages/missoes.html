<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Homens - IECA</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">

<!-- ICONES -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* 🔥 NOVA CAIXA MODERNA */
.message-container {
    position: relative;
    margin-bottom: 20px;
}

.message-container {
    position: relative;
    margin-top: 25px;
    margin-bottom: 20px;
}

.message-box {
    display: flex;
    align-items: center;
    background: #1e1e2f;
    border-radius: 50px;
    padding: 6px 10px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}

.message-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: #fff;
    padding: 12px;
    font-size: 14px;
}

.btn-plus {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: #2a2a40;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
}

.btn-send {
    background: #4CAF50;
    border: none;
    padding: 10px 14px;
    border-radius: 50%;
    color: white;
    cursor: pointer;
}

/* MENU */
.upload-menu {
    position: absolute;
    left: -160px; /* 🔥 joga o menu pra esquerda da caixa */
    top: 50%;
    transform: translateY(-50%);
    
    background: #e106060f; /* 🔥 fundo branco */
    border-radius: 10px;
    padding: 8px;
    display: none;
    flex-direction: column;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

.upload-menu button {
    background: none;
    border: none;
    color: #090909; /* 🔥 fonte preta */
    padding: 8px 12px;
    text-align: left;
    cursor: pointer;
    font-weight: 500;
}

.upload-menu button:hover {
    background: #f0f0f0;
}

.upload-menu button {
    background: none;
    border: none;
    color: black;
    padding: 8px;
    text-align: left;
    cursor: pointer;
}

.upload-menu button:hover {
    background: #3a3a5a;
}

</style>

</head>

<body>

<script>
// 🔥 Define o departamento ativo
localStorage.setItem("departamento_ativo", "Departamento de Missões");
</script>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>IECA</h2>

        <ul>

            <li onclick="window.location.href='../feed.html'">
                <i class="fas fa-home"></i> <span>Feed</span>
            </li>

            <li onclick="window.location.href='congregacao.html'">
                <i class="fas fa-church"></i> <span>Congregações</span>
            </li>

            <li class="active" onclick="window.location.href='departamento.html'">
                <i class="fas fa-users"></i> <span>Departamentos</span>
            </li>

            <li onclick="window.location.href='secretaria.html'">
                <i class="fas fa-file-alt"></i> <span>Secretaria</span>
            </li>

            <li onclick="window.location.href='financeiro.html'">
                <i class="fas fa-coins"></i> <span>Financeiro</span>
            </li>

            <li onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
            </li>

        </ul>

    </aside>

    <!-- CONTEÚDO -->
    <main class="main-content">

        <header class="topo">
            <h2>🧔 Departamento de Missões</h2>
        </header>

        <div class="container">

            <!-- 🔥 CAIXA DE POST -->
            <div class="message-container">

                <div class="message-box">
                    <button class="btn-plus" onclick="toggleMenu()">+</button>

                    <input type="text" id="texto" placeholder="Escreva um aviso para os homens..." />

                    <button class="btn-send" onclick="criarPost()">➤</button>
                </div>

                <div class="upload-menu" id="uploadMenu">
                    <button onclick="openFile('image')">📷 Foto</button>
                    <button onclick="openFile('video')">🎥 Vídeo</button>
                    <button onclick="openFile('file')">📄 Documento</button>
                </div>

                <input type="file" id="midia" accept="image/*,video/*" hidden>

            </div>

            <!-- FEED DO DEPARTAMENTO -->
            <section id="feed" class="feed"></section>

        </div>

    </main>

</div>

<!-- JS POSTS -->
<script src="../js/modules/posts.js"></script>

<!-- CONTROLE UI -->
<script>

function toggleMenu() {
    const menu = document.getElementById("uploadMenu");
    menu.style.display = menu.style.display === "flex" ? "none" : "flex";
}

function openFile(type) {
    document.getElementById("uploadMenu").style.display = "none";
    document.getElementById("midia").click();
}

</script>

</body>
</html>
