<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard - IECA</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">

<style>

body{
    background: linear-gradient(135deg,#eef2f7,#dfe7f3);
    font-family:'Segoe UI';
}

/* HEADER */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.btn-voltar{
    background:#ff9800;
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    text-align:center;
    transition:0.2s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    font-size:28px;
    margin-bottom:5px;
}

.card p{
    color:#666;
}

.entrada{color:#4CAF50;}
.saida{color:#f44336;}
.membros{color:#2196F3;}
.ocorrencias{color:#ff9800;}

/* CONGREGAÇÕES */
.congregacoes{
    margin-top:20px;
}

.congregacoes h2{
    margin-bottom:10px;
}

.lista{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.box{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    cursor:pointer;
    transition:0.2s;
}

.box:hover{
    transform:scale(1.02);
    background:#f9f9f9;
}

.box h3{
    margin-bottom:5px;
}

/* BADGE */
.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    background:#2196F3;
    color:white;
    margin-top:5px;
}

</style>

</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
<h2>IECA</h2>

<ul>
<li onclick="window.location.href='../feed.html'">📢 Feed</li>
<li class="active">📊 Dashboard</li>
<li onclick="window.location.href='congregacao.html'">⛪ Congregações</li>
<li onclick="window.location.href='secretaria.html'">📋 Secretaria</li>
<li onclick="window.location.href='financeiro.html'">💰 Financeiro</li>
</ul>
</aside>

<!-- CONTEÚDO -->
<main class="main-content">

<div class="top-bar">
    <h2 id="titulo">📊 Dashboard</h2>

    <button id="btnVoltar" class="btn-voltar" onclick="voltarMatriz()">
        ⬅ Voltar Matriz
    </button>
</div>

<div class="container">

<!-- CARDS -->
<div class="cards">

<div class="card">
<h3 id="totalMembros" class="membros">0</h3>
<p>Membros</p>
</div>

<div class="card">
<h3 id="totalEntrada" class="entrada">R$ 0</h3>
<p>Entradas</p>
</div>

<div class="card">
<h3 id="totalSaida" class="saida">R$ 0</h3>
<p>Saídas</p>
</div>

<div class="card">
<h3 id="totalOcorrencias" class="ocorrencias">0</h3>
<p>Ocorrências</p>
</div>

</div>

<!-- CONGREGAÇÕES -->
<div id="areaMatriz" class="congregacoes">

<h2>⛪ Congregações</h2>

<div id="listaCongregacoes" class="lista"></div>

</div>

</div>

</main>
</div>

<!-- STORAGE -->
<script src="../js/services/storage.js"></script>

<script>

// 📌 CONTEXTO
let context = storage.get("app_context");

if(!context || !context.congregacao){
    context = { congregacao: "Matriz" };
    storage.set("app_context", context);
}

const isMatriz = context.congregacao.toUpperCase().includes("MATRIZ");

// 🔥 TÍTULO
document.getElementById("titulo").innerText =
    "📊 Dashboard " + context.congregacao;

// 🔥 BOTÃO VOLTAR
if(isMatriz){
    document.getElementById("btnVoltar").style.display = "none";
}

// 📦 DADOS
let membros = storage.get("membros") || [];
let financeiro = storage.get("financeiro") || [];
let ocorrencias = storage.get("ocorrencias") || [];
let congregacoes = storage.get("congregacoes") || [];

// 🔍 FILTRO
function filtrar(dados){
    if(isMatriz) return dados;

    return dados.filter(d =>
        d.congregacao === context.congregacao
    );
}

// 📊 CALCULAR
function calcular(){

    let m = filtrar(membros);
    let f = filtrar(financeiro);
    let o = filtrar(ocorrencias);

    let entrada = 0;
    let saida = 0;

    f.forEach(d=>{
        if(d.tipo === "entrada") entrada += d.valor;
        else saida += d.valor;
    });

    document.getElementById("totalMembros").innerText = m.length;
    document.getElementById("totalEntrada").innerText = "R$ " + entrada.toFixed(2);
    document.getElementById("totalSaida").innerText = "R$ " + saida.toFixed(2);
    document.getElementById("totalOcorrencias").innerText = o.length;
}

// 🔥 LISTAR CONGREGAÇÕES
function renderCongregacoes(){

    if(!isMatriz){
        document.getElementById("areaMatriz").style.display = "none";
        return;
    }

    const lista = document.getElementById("listaCongregacoes");
    lista.innerHTML = "";

    congregacoes.forEach(c=>{

        lista.innerHTML += `
        <div class="box" onclick="abrir('${c.nome}')">
            <h3>${c.nome}</h3>
            <p>📍 ${c.endereco}</p>
            <span class="badge">Ver Dashboard</span>
        </div>
        `;
    });
}

// 🔄 TROCAR
function abrir(nome){
    context.congregacao = nome;
    storage.set("app_context", context);
    window.location.reload();
}

// ⬅ VOLTAR MATRIZ
function voltarMatriz(){
    context.congregacao = "Matriz";
    storage.set("app_context", context);
    window.location.reload();
}

// INIT
calcular();
renderCongregacoes();

</script>

</body>
</html>
