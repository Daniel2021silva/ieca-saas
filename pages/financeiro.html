<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Financeiro - IECA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f7;font-family:'Segoe UI',Tahoma,Verdana,sans-serif;color:#1f2937}
.page{max-width:1200px;margin:0 auto;padding:20px}
.topo-flex{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topo-titulo h2{margin:0;font-size:28px;color:#0f172a}
.topo-titulo p{margin:6px 0 0;color:#64748b;font-size:14px}
.badge-matriz{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-top:8px}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.card,.form,.table-box{background:#fff;padding:18px;border-radius:14px;margin-bottom:20px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.card{text-align:center}
.card h3{margin:0 0 8px;font-size:28px}
.card p{margin:0;color:#64748b;font-weight:600}
.card.entrada h3{color:#15803d}
.card.saida h3{color:#dc2626}
.card.saldo h3{color:#2563eb}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #d1d5db;outline:none;font-size:14px;background:#fff}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{padding:11px 14px;border:none;border-radius:10px;cursor:pointer;font-weight:600}
.primary{background:#007bff;color:white}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#dc2626;color:white}
.action-btn{padding:8px 10px;border-radius:8px;font-size:13px;margin:2px}
.search-box{margin-bottom:14px}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{background:#007bff;color:white;padding:12px;text-align:left;font-size:14px}
td{padding:12px 10px;border-bottom:1px solid #eee;font-size:14px;vertical-align:middle}
.tipo-entrada{color:green;font-weight:bold;text-transform:capitalize}
.tipo-saida{color:red;font-weight:bold;text-transform:capitalize}
.empty{text-align:center;color:#64748b;padding:20px 10px}
.status-box{display:none;margin-bottom:16px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600}
.status-box.show{display:block}
.status-info{background:#eef5ff;color:#1d4e89;border:1px solid #cfe1ff}
.status-success{background:#ecfff2;color:#1f7a3d;border:1px solid #bfe9cc}
.status-error{background:#fff1f2;color:#b42318;border:1px solid #fecdd3}
@media(max-width:768px){.page{padding:14px}.topo-titulo h2{font-size:22px}th,td{font-size:13px}}
</style>
</head>

<body>

<button class="menu-toggle" id="menuToggle">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">

<aside class="sidebar" id="sidebar">
    <h2>IECA</h2>
    <ul>
        <li onclick="window.location.href='../feed.html'"><i class="fas fa-home"></i> Feed</li>
        <li onclick="window.location.href='departamento.html'"><i class="fas fa-users"></i> Departamentos</li>
        <li onclick="window.location.href='secretaria.html'"><i class="fas fa-file-alt"></i> Secretaria</li>
        <li class="active"><i class="fas fa-coins"></i> Financeiro</li>
        <li onclick="window.location.href='usuarios.html'"><i class="fas fa-user-cog"></i> Usuários</li>
    </ul>
</aside>

<main class="main-content">
<div class="page">

<div id="statusBox" class="status-box status-info"></div>

<div class="topo-flex">
    <div class="topo-titulo">
        <h2 id="titulo">💰 Financeiro</h2>
        <p id="subtitulo">Gestão de entradas e saídas.</p>
        <span id="modoSistema" class="badge-matriz" style="display:none;">VISÃO MATRIZ</span>
    </div>

    <button class="secondary" onclick="window.location.href='../feed.html'">⬅ Voltar ao Feed</button>
</div>

<div class="dashboard">
    <div class="card entrada"><h3 id="entrada">R$ 0,00</h3><p>Entradas</p></div>
    <div class="card saida"><h3 id="saida">R$ 0,00</h3><p>Saídas</p></div>
    <div class="card saldo"><h3 id="saldo">R$ 0,00</h3><p>Saldo</p></div>
</div>

<div class="form">
    <h3>📋 Novo lançamento</h3>

    <div class="form-grid">
        <select id="tipo">
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
        </select>

        <select id="categoria">
            <option value="Dízimo">Dízimo</option>
            <option value="Oferta">Oferta</option>
            <option value="Doação">Doação</option>
            <option value="Campanha">Campanha</option>
            <option value="Gasolina">Gasolina</option>
            <option value="Manutenção">Manutenção</option>
            <option value="Luz">Luz</option>
            <option value="Água">Água</option>
            <option value="Internet">Internet</option>
            <option value="Limpeza">Limpeza</option>
            <option value="Outro">Outro</option>
        </select>

        <input type="number" id="valor" placeholder="Valor" min="0" step="0.01">
        <input type="text" id="descricao" placeholder="Descrição">
        <input type="date" id="dataLancamento">
    </div>

    <div class="form-actions">
        <button class="primary" onclick="salvarLancamento()">Salvar lançamento</button>
        <button class="secondary" onclick="cancelarEdicao()">Cancelar edição</button>
    </div>
</div>

<div class="table-box">
    <div class="search-box">
        <input type="text" id="busca" placeholder="🔍 Buscar por categoria, descrição, tipo ou congregação..." onkeyup="render()">
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                    <th>Descrição</th>
                    <th>Data</th>
                    <th id="thIgreja" style="display:none;">Igreja</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>
</div>

</div>
</main>
</div>

<script type="module">
import { supabase } from "../js/services/supabase.js";
import { getUsuarioAtual } from "../js/modules/auth.js";

let usuarioAtual = null;
let dados = [];
let editId = null;

function mostrarMensagem(texto, tipo = "info"){
    const box = document.getElementById("statusBox");
    box.className = "status-box show";
    if(tipo === "success") box.classList.add("status-success");
    else if(tipo === "error") box.classList.add("status-error");
    else box.classList.add("status-info");
    box.textContent = texto;
}

function ehAdminMatriz(){
    return usuarioAtual && usuarioAtual.tipo === "matriz_admin";
}

function podeAcessarFinanceiro(){
    return usuarioAtual && ["matriz_admin", "pastor", "financeiro"].includes(usuarioAtual.tipo);
}

function getIgrejaId(){
    return usuarioAtual?.congregacao_id || null;
}

function getIgrejaNome(){
    return usuarioAtual?.congregacao_nome || "Matriz";
}

function escaparHTML(texto){
    return String(texto || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function normalizarTexto(valor){
    return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();
}

function formatarMoeda(valor){
    return Number(valor || 0).toLocaleString("pt-BR", {
        style:"currency",
        currency:"BRL"
    });
}

function formatarData(data){
    if(!data) return "-";
    const d = new Date(data + "T00:00:00");
    if(isNaN(d.getTime())) return String(data);
    return d.toLocaleDateString("pt-BR");
}

async function validarAcessoFinanceiro(){
    usuarioAtual = await getUsuarioAtual();

    if(!usuarioAtual){
        alert("Faça login para acessar o financeiro.");
        window.location.href = "../index.html";
        return false;
    }

    if(!podeAcessarFinanceiro()){
        alert("Você não tem permissão para acessar o financeiro.");
        window.location.href = "../feed.html";
        return false;
    }

    return true;
}

function atualizarCabecalho(){
    document.getElementById("modoSistema").style.display = ehAdminMatriz() ? "inline-block" : "none";
    document.getElementById("thIgreja").style.display = ehAdminMatriz() ? "table-cell" : "none";

    const nomeIgreja = getIgrejaNome();

    document.getElementById("titulo").innerText = "💰 Financeiro - " + nomeIgreja;
    document.getElementById("subtitulo").innerText = ehAdminMatriz()
        ? "Visualizando financeiro geral da matriz."
        : "Controle financeiro da congregação " + nomeIgreja + ".";
}

async function carregarLancamentos(){
    let query = supabase
        .from("financeiro")
        .select("*")
        .order("data", { ascending:false });

    if(!ehAdminMatriz()){
        query = query.eq("congregacao_id", getIgrejaId());
    }

    const { data, error } = await query;

    if(error){
        throw new Error(error.message || "Erro ao carregar financeiro.");
    }

    dados = data || [];
}

function getFiltradoBusca(){
    const filtro = normalizarTexto(document.getElementById("busca").value);

    if(!filtro) return [...dados];

    return dados.filter(item => {
        const alvo = [
            item.tipo,
            item.categoria,
            item.descricao,
            item.congregacao_nome,
            item.data
        ].map(normalizarTexto).join(" ");

        return alvo.includes(filtro);
    });
}

window.salvarLancamento = async function(){
    const tipo = document.getElementById("tipo").value;
    const categoria = document.getElementById("categoria").value;
    const valor = parseFloat(document.getElementById("valor").value);
    const descricao = document.getElementById("descricao").value.trim();
    const dataLancamento = document.getElementById("dataLancamento").value || new Date().toISOString().slice(0,10);

    if(isNaN(valor) || valor <= 0){
        mostrarMensagem("Digite um valor válido.", "error");
        return;
    }

    const payload = {
        tipo,
        categoria,
        valor,
        descricao,
        data: dataLancamento,
        congregacao_id: getIgrejaId(),
        congregacao_nome: getIgrejaNome(),
        usuario_id: usuarioAtual.id
    };

    let result;

    if(editId){
        result = await supabase
            .from("financeiro")
            .update(payload)
            .eq("id", editId);
    }else{
        result = await supabase
            .from("financeiro")
            .insert([payload]);
    }

    if(result.error){
        mostrarMensagem(result.error.message, "error");
        return;
    }

    cancelarEdicao();
    await carregarLancamentos();
    render();
    mostrarMensagem("Lançamento salvo com sucesso.", "success");
};

window.editar = function(id){
    const item = dados.find(d => String(d.id) === String(id));
    if(!item) return;

    editId = id;

    document.getElementById("tipo").value = item.tipo || "entrada";
    document.getElementById("categoria").value = item.categoria || "Dízimo";
    document.getElementById("valor").value = item.valor || "";
    document.getElementById("descricao").value = item.descricao || "";
    document.getElementById("dataLancamento").value = item.data ? String(item.data).slice(0,10) : "";

    window.scrollTo({ top:0, behavior:"smooth" });
};

window.excluir = async function(id){
    const item = dados.find(d => String(d.id) === String(id));
    if(!item) return;

    const confirmar = confirm(`Excluir este lançamento de ${formatarMoeda(item.valor)}?`);
    if(!confirmar) return;

    const { error } = await supabase
        .from("financeiro")
        .delete()
        .eq("id", id);

    if(error){
        mostrarMensagem(error.message, "error");
        return;
    }

    if(String(editId) === String(id)){
        cancelarEdicao();
    }

    await carregarLancamentos();
    render();
    mostrarMensagem("Lançamento excluído com sucesso.", "success");
};

window.cancelarEdicao = function(){
    editId = null;
    document.getElementById("tipo").value = "entrada";
    document.getElementById("categoria").value = "Dízimo";
    document.getElementById("valor").value = "";
    document.getElementById("descricao").value = "";
    document.getElementById("dataLancamento").value = "";
};

window.render = function(){
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    const registros = getFiltradoBusca();

    let entrada = 0;
    let saida = 0;

    registros.forEach(d => {
        if(d.tipo === "entrada") entrada += Number(d.valor || 0);
        else saida += Number(d.valor || 0);

        lista.innerHTML += `
            <tr>
                <td class="${d.tipo === "entrada" ? "tipo-entrada" : "tipo-saida"}">${escaparHTML(d.tipo)}</td>
                <td>${escaparHTML(d.categoria)}</td>
                <td>${formatarMoeda(d.valor)}</td>
                <td>${escaparHTML(d.descricao || "-")}</td>
                <td>${formatarData(d.data)}</td>
                ${ehAdminMatriz() ? `<td>${escaparHTML(d.congregacao_nome || "Matriz")}</td>` : ""}
                <td>
                    <button class="action-btn primary" onclick="editar('${d.id}')">✏️ Editar</button>
                    <button class="action-btn danger" onclick="excluir('${d.id}')">🗑 Excluir</button>
                </td>
            </tr>
        `;
    });

    if(!registros.length){
        lista.innerHTML = `
            <tr>
                <td colspan="${ehAdminMatriz() ? 7 : 6}" class="empty">
                    Nenhum lançamento encontrado.
                </td>
            </tr>
        `;
    }

    document.getElementById("entrada").innerText = formatarMoeda(entrada);
    document.getElementById("saida").innerText = formatarMoeda(saida);
    document.getElementById("saldo").innerText = formatarMoeda(entrada - saida);
};

const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const sidebarOverlay = document.getElementById("sidebarOverlay");

if(menuToggle && sidebar && sidebarOverlay){
    menuToggle.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        sidebarOverlay.classList.toggle("show");
    });

    sidebarOverlay.addEventListener("click", () => {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("show");
    });
}

async function iniciarFinanceiro(){
    const acessoLiberado = await validarAcessoFinanceiro();
    if(!acessoLiberado) return;

    atualizarCabecalho();

    try{
        await carregarLancamentos();
        render();
    }catch(error){
        mostrarMensagem(error.message || "Erro ao carregar financeiro.", "error");
    }
}

iniciarFinanceiro();
</script>

</body>
</html>
