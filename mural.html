<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mural IECA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef1f5;
      color: #101828;
    }

    .topbar {
      width: 100%;
      background: linear-gradient(135deg, #101828, #1d2939);
      color: #fff;
      padding: 26px 18px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }

    .topbar h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }

    .topbar p {
      margin: 8px 0 0;
      font-size: 15px;
      color: #d0d5dd;
    }

    .container {
      max-width: 920px;
      margin: 28px auto;
      padding: 0 16px 40px;
    }

    .info-box {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(16,24,40,0.08);
      border: 1px solid #eaecf0;
    }

    .info-box h2 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #101828;
    }

    .info-box p {
      margin: 0;
      color: #667085;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .btn-refresh {
      background: #ff6b00;
      color: #fff;
    }

    .btn-youtube {
      background: #e62117;
      color: #fff;
    }

    .status {
      text-align: center;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      color: #667085;
      box-shadow: 0 8px 24px rgba(16,24,40,0.06);
      border: 1px solid #eaecf0;
    }

    .post-card {
      background: #fff;
      border-radius: 20px;
      margin-bottom: 22px;
      overflow: hidden;
      border: 1px solid #eaecf0;
      box-shadow: 0 10px 26px rgba(16,24,40,0.08);
    }

    .post-header {
      padding: 18px 20px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b00, #ffb000);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      flex-shrink: 0;
    }

    .post-meta {
      min-width: 0;
    }

    .post-author {
      font-weight: 800;
      font-size: 16px;
      color: #101828;
    }

    .post-date {
      font-size: 13px;
      color: #667085;
      margin-top: 2px;
    }

    .post-body {
      padding: 4px 20px 18px;
    }

    .post-title {
      font-size: 20px;
      font-weight: 800;
      margin: 8px 0 10px;
      color: #101828;
    }

    .post-text {
      font-size: 16px;
      line-height: 1.55;
      color: #344054;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-media {
      width: 100%;
      max-height: 620px;
      object-fit: contain;
      background: #000;
      display: block;
      border-top: 1px solid #eaecf0;
    }

    .video-wrap {
      background: #000;
    }

    .video-wrap video {
      width: 100%;
      max-height: 620px;
      display: block;
      background: #000;
    }

    .post-footer {
      border-top: 1px solid #eaecf0;
      padding: 14px 20px;
      background: #fcfcfd;
      color: #667085;
      font-size: 14px;
    }

    .comments {
      border-top: 1px solid #eaecf0;
      padding: 14px 20px 18px;
      background: #f9fafb;
    }

    .comments-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 800;
      color: #344054;
    }

    .comment {
      background: #fff;
      border: 1px solid #eaecf0;
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 800;
      color: #101828;
      margin-bottom: 4px;
    }

    .comment-text {
      font-size: 14px;
      color: #475467;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-comments {
      font-size: 14px;
      color: #98a2b3;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff3e6;
      color: #b54708;
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 600px) {
      .topbar h1 {
        font-size: 26px;
      }

      .container {
        margin-top: 18px;
        padding: 0 12px 30px;
      }

      .info-box {
        padding: 18px;
      }

      .info-box h2 {
        font-size: 21px;
      }

      .post-header {
        padding: 16px 16px 8px;
      }

      .post-body {
        padding: 4px 16px 16px;
      }

      .post-title {
        font-size: 18px;
      }

      .post-text {
        font-size: 15px;
      }

      .comments,
      .post-footer {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <h1>📌 Mural IECA</h1>
    <p>Publicações, avisos, fotos e vídeos da igreja.</p>
  </header>

  <main class="container">

    <section class="info-box">
      <h2>Feed geral da igreja</h2>
      <p>
        Este espaço é público para membros, obreiros e congregações acompanharem os avisos,
        publicações, fotos, vídeos e comunicados oficiais.
      </p>

      <div class="actions">
        <button class="btn btn-refresh" onclick="carregarMural()">
          🔄 Atualizar mural
        </button>

        <a class="btn btn-youtube" href="https://www.youtube.com/" target="_blank">
          ▶️ YouTube
        </a>
      </div>

      <span class="badge">Acesso livre — sem login</span>
    </section>

    <section id="mural">
      <div class="status">Carregando publicações...</div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://ghlyavedvvblivlidlxg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-HIHdhPOjt_JxObSzIE7nQ_y21_r5fS";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const mural = document.getElementById("mural");

    function escaparHTML(texto) {
      if (!texto) return "";
      return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatarData(dataISO) {
      if (!dataISO) return "";
      try {
        return new Date(dataISO).toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      } catch {
        return "";
      }
    }

    function primeiraLetra(nome) {
      if (!nome) return "I";
      return nome.trim().charAt(0).toUpperCase();
    }

    function pegarCampo(post, campos) {
      for (const campo of campos) {
        if (post[campo] !== undefined && post[campo] !== null && post[campo] !== "") {
          return post[campo];
        }
      }
      return "";
    }

    function criarMidiaHTML(url, tipo) {
      if (!url) return "";

      const urlSegura = escaparHTML(url);
      const tipoMidia = String(tipo || "").toLowerCase();

      if (tipoMidia.includes("video") || urlSegura.match(/\.(mp4|webm|ogg|mov)$/i)) {
        return `
          <div class="video-wrap">
            <video controls preload="metadata">
              <source src="${urlSegura}">
              Seu navegador não suporta vídeo.
            </video>
          </div>
        `;
      }

      if (tipoMidia.includes("image") || urlSegura.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
        return `<img class="post-media" src="${urlSegura}" alt="Imagem da publicação">`;
      }

      return `
        <div class="post-footer">
          📎 <a href="${urlSegura}" target="_blank">Abrir anexo</a>
        </div>
      `;
    }

    async function carregarComentarios(postId) {
      const { data, error } = await supabase
        .from("comentarios")
        .select("*")
        .eq("post_id", postId)
        .order("criado_em", { ascending: true });

      if (error) {
        console.warn("Erro ao carregar comentários:", error.message);
        return [];
      }

      return data || [];
    }

    function renderizarComentarios(comentarios) {
      if (!comentarios || comentarios.length === 0) {
        return `<div class="empty-comments">Nenhum comentário nesta publicação.</div>`;
      }

      return comentarios.map(comentario => {
        const autor = pegarCampo(comentario, ["autor_nome", "autor", "nome"]) || "Membro";
        const texto = pegarCampo(post, ["texto", "conteudo", "conteúdo", "mensagem", "descricao"]);

        return `
          <div class="comment">
            <div class="comment-author">${escaparHTML(autor)}</div>
            <div class="comment-text">${escaparHTML(texto)}</div>
          </div>
        `;
      }).join("");
    }

    async function carregarMural() {
      mural.innerHTML = `<div class="status">Carregando publicações...</div>`;

      const { data: posts, error } = await supabase
        .from("posts")
        .select("*")
        .order("criado_at", { ascending: false });

      if (error) {
        mural.innerHTML = `
          <div class="status">
            Erro ao carregar o mural: ${escaparHTML(error.message)}
          </div>
        `;
        return;
      }

      if (!posts || posts.length === 0) {
        mural.innerHTML = `
          <div class="status">
            Nenhuma publicação encontrada no mural.
          </div>
        `;
        return;
      }

      mural.innerHTML = "";

      for (const post of posts) {
        const titulo = pegarCampo(post, ["titulo", "title"]);
        const texto = pegarCampo(post, [ "conteudo", "texto",  "mensagem", "descricao"]);
        const autor = pegarCampo(post, ["autor_nome", "autor", "criado_por", "departamento"]) || "IECA";
        const dataPost = pegarCampo(post, [ "created_at","criado_em", "data"]);
        const midiaUrl = pegarCampo(post, ["midia_url", "media_url", "arquivo_url", "url"]);
        const midiaTipo = pegarCampo(post, ["midia_tipo", "media_tipo", "tipo_arquivo", "tipo"]);
        const congregacao = pegarCampo(post, ["congregacao", "igreja", "setor"]);

        const comentarios = await carregarComentarios(post.id);

        const card = document.createElement("article");
        card.className = "post-card";

        card.innerHTML = `
          <div class="post-header">
            <div class="avatar">${escaparHTML(primeiraLetra(autor))}</div>
            <div class="post-meta">
              <div class="post-author">${escaparHTML(autor)}</div>
              <div class="post-date">
                ${formatarData(dataPost)}
                ${congregacao ? " • " + escaparHTML(congregacao) : ""}
              </div>
            </div>
          </div>

          <div class="post-body">
            ${titulo ? `<div class="post-title">${escaparHTML(titulo)}</div>` : ""}
            ${texto ? `<div class="post-text">${escaparHTML(texto)}</div>` : ""}
          </div>

          ${criarMidiaHTML(midiaUrl, midiaTipo)}

          <div class="comments">
            <h3 class="comments-title">Comentários</h3>
            ${renderizarComentarios(comentarios)}
          </div>
        `;

        mural.appendChild(card);
      }
    }

    document.addEventListener("DOMContentLoaded", carregarMural);
  </script>

</body>
</html>
