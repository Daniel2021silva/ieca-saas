<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Feed - IECA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef2f7;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color:#1f2937;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.topo h2{
    margin:0;
    font-size:28px;
    color:#0f172a;
}

.topo-left{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.topo-subtitulo{
    color:#64748b;
    font-size:14px;
    margin:0;
}

.topo-badges{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:4px;
}

.badge-info{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.badge-visitante{
    display:inline-block;
    background:#f3f4f6;
    color:#374151;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

#btnLogout{
    background:#dc2626;
    color:#fff;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    display:none;
}

#btnLogout:hover{
    opacity:.92;
}

.container{
    max-width:900px;
    width:100%;
}

.live-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
    background:#fff;
    padding:14px 16px;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
    flex-wrap:wrap;
}

.live-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.live-text{
    color:#dc2626;
    font-weight:bold;
}

.message-container{
    margin-top:10px;
    margin-bottom:20px;
    position:relative;
}

.message-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:#1e1e2f;
    border-radius:50px;
    padding:8px 10px;
    box-shadow:0 6px 16px rgba(0,0,0,0.15);
}

.message-box input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    color:#fff;
    padding:12px;
    font-size:15px;
}

.message-box input::placeholder{
    color:#cbd5e1;
}

.btn-send{
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    flex-shrink:0;
    background:#16a34a;
    color:white;
}

.post{
    background:white;
    padding:16px;
    border-radius:14px;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
}

.post-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

.post-tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.post-igreja{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.post-data{
    color:#64748b;
    font-size:12px;
}

.post-autor{
    color:#334155;
    font-size:13px;
    font-weight:600;
}

.post p{
    margin:0;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.5;
}

.empty-feed,
.box-info{
    background:#fff;
    padding:24px;
    border-radius:14px;
    text-align:center;
    color:#64748b;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
}

.box-info{
    margin-bottom:16px;
    padding:16px;
}

.oculto{
    display:none !important;
}

@media(max-width:768px){
    .topo h2{
        font-size:22px;
    }

    .message-box{
        padding:6px 8px;
    }

    .btn-send{
        width:40px;
        height:40px;
    }
}
</style>
</head>

<body>
<button class="menu-toggle" id="menuToggle">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">

    <aside class="sidebar" id="sidebar">
        <h2>IECA</h2>

        <ul>
            <li class="active" onclick="window.location.href='feed.html'">
                <i class="fas fa-home"></i> Feed
            </li>

            <li onclick="window.location.href='pages/congregacao.html'">
                <i class="fas fa-church"></i> Congregações
            </li>

            <li onclick="irParaAreaProtegida('pages/departamento.html')">
                <i class="fas fa-users"></i> Departamentos
            </li>

            <li onclick="irParaAreaProtegida('pages/secretaria.html')">
                <i class="fas fa-file-alt"></i> Secretaria
            </li>

            <li onclick="irParaAreaProtegida('pages/financeiro.html')">
                <i class="fas fa-coins"></i> Financeiro
            </li>

            <li onclick="window.location.href='usuarios.html'">
    👥 Usuários
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topo">
            <div class="topo-left">
                <h2>📢 Feed</h2>
                <p class="topo-subtitulo" id="subtituloPagina">Publicações da igreja.</p>

                <div class="topo-badges">
                    <span id="badgeUsuario" class="badge-info oculto"></span>
                    <span id="badgeVisitante" class="badge-visitante">VISUALIZAÇÃO LIVRE</span>
                </div>
            </div>

            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button id="btnLogout" onclick="logout()">Sair</button>
            </div>
        </header>

        <div class="container">
            <div class="live-box">
                <a href="https://youtube.com/@IECAUMAIGREJAFAMILIA" target="_blank" rel="noopener noreferrer">
                    <button class="live-btn">▶ YouTube</button>
                </a>
                <span id="liveStatus" class="live-text">Nenhuma transmissão ao vivo no momento</span>
            </div>

            <div id="boxInfoVisitante" class="box-info">
                Você pode visualizar o feed livremente. Para publicar, faça login.
            </div>

            <div class="message-container oculto" id="composerArea">
                <div class="message-box">
                    <input type="text" id="texto" placeholder="Escreva uma mensagem...">
                    <button class="btn-send" onclick="criarPostHandler()">➤</button>
                </div>
            </div>

            <section id="feed"></section>
        </div>
    </main>
</div>

<script type="module">
import { listarPosts, criarPost, getUsuarioAtual, logoutRequest } from "./js/modules/posts.js";

let usuarioAtual = null;
let autenticado = false;
let posts = [];

function escaparHTML(texto){
    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatarData(dataISO){
    if(!dataISO) return "";
    const data = new Date(dataISO);
    if(isNaN(data.getTime())) return "";
    return data.toLocaleString("pt-BR");
}

function atualizarTopo(){
    const badgeUsuario = document.getElementById("badgeUsuario");
    const badgeVisitante = document.getElementById("badgeVisitante");
    const btnLogout = document.getElementById("btnLogout");
    const composerArea = document.getElementById("composerArea");
    const boxInfoVisitante = document.getElementById("boxInfoVisitante");
    const subtitulo = document.getElementById("subtituloPagina");

    if(autenticado && usuarioAtual){
        badgeUsuario.classList.remove("oculto");
        badgeUsuario.textContent = `${usuarioAtual.nome} • ${usuarioAtual.tipo}`;
        badgeVisitante.style.display = "none";
        btnLogout.style.display = "inline-block";
        composerArea.classList.remove("oculto");
        boxInfoVisitante.style.display = "none";
        subtitulo.textContent = "Publicações da igreja e da sua congregação.";
    }else{
        badgeUsuario.classList.add("oculto");
        badgeVisitante.style.display = "inline-block";
        btnLogout.style.display = "none";
        composerArea.classList.add("oculto");
        boxInfoVisitante.style.display = "block";
        subtitulo.textContent = "Publicações da igreja.";
    }
}

async function carregarSessao(){
    usuarioAtual = await getUsuarioAtual();
    autenticado = !!usuarioAtual;
    atualizarTopo();
}

async function carregarPostsDoBackend(){
    try{
        const data = await listarPosts();

        posts = data.map(p => ({
            id: p.id,
            texto: p.conteudo,
            data: p.criado_em,
            congregacao_nome: p.congregacao_nome || "IECA",
            autor_nome: p.autor_nome || "Usuário"
        }));
    }catch(error){
        console.error(error);
        posts = [];
    }
}

function render(){
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    if(!posts.length){
        feed.innerHTML = `
            <div class="empty-feed">
                Nenhuma publicação encontrada.
            </div>
        `;
        return;
    }

    posts.forEach(p => {
        feed.innerHTML += `
            <div class="post">
                <div class="post-header">
                    <div class="post-tags">
                        <span class="post-igreja">${escaparHTML(p.congregacao_nome)}</span>
                        <span class="post-autor">${escaparHTML(p.autor_nome)}</span>
                    </div>
                    <span class="post-data">${formatarData(p.data)}</span>
                </div>

                <p>${escaparHTML(p.texto)}</p>
            </div>
        `;
    });
}

window.criarPostHandler = async function(){
    if(!autenticado){
        alert("Faça login para publicar.");
        return;
    }

    const texto = document.getElementById("texto").value.trim();

    if(!texto){
        alert("Escreva uma mensagem.");
        return;
    }

    try{
        await criarPost(texto);
        document.getElementById("texto").value = "";
        await carregarPostsDoBackend();
        render();
    }catch(error){
        alert(error.message);
    }
};

window.logout = async function(){
    await logoutRequest();
};

window.irParaAreaProtegida = function(url){
    if(!autenticado){
        alert("Faça login para acessar esta área.");
        window.location.href = "index.html";
        return;
    }

    window.location.href = url;
};

const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const sidebarOverlay = document.getElementById("sidebarOverlay");

if(menuToggle && sidebar && sidebarOverlay){
    menuToggle.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        sidebarOverlay.classList.toggle("show");
    });

    sidebarOverlay.addEventListener("click", () => {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("show");
    });

    window.addEventListener("resize", () => {
        if(window.innerWidth > 768){
            sidebar.classList.remove("open");
            sidebarOverlay.classList.remove("show");
        }
    });
}

async function iniciar(){
    await carregarSessao();
    await carregarPostsDoBackend();
    render();
}

iniciar();
</script>

</body>
</html>
